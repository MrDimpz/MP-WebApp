<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#220538"/>
      <stop offset="55%" stop-color="#150226"/>
      <stop offset="100%" stop-color="#0b0114"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="0.5" cy="0.35" r="0.55">
      <stop offset="0%" stop-color="#F6C915" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE55C"/>
      <stop offset="50%" stop-color="#F6C915"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="emeraldTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="amberTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="slateTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E104B"/>
      <stop offset="100%" stop-color="#1B0630"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#goldGlow)"/>

  <!-- Subtle Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="240" y1="0" x2="240" y2="675"/>
    <line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/>
    <line x1="960" y1="0" x2="960" y2="675"/>
  </g>

  <!-- Left Branding & Copy -->
  <g transform="translate(85, 120)">
    <rect x="0" y="0" width="240" height="36" rx="18" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="24" cy="18" r="6" fill="#10B981"/>
    <text x="42" y="23" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="2">CROWD WORDLE LIVE</text>

    <text x="0" y="118" fill="url(#titleGold)" font-family="system-ui, sans-serif" font-size="82" font-weight="900" font-style="italic" letter-spacing="-2">CROWDLE</text>
    <text x="0" y="162" fill="#E9D5FF" font-family="system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="1">CHAT VOTES THE WORD • 5 TO 8 LETTERS</text>

    <!-- Consensus Pill -->
    <g transform="translate(0, 205)">
      <rect width="430" height="92" rx="22" fill="#1C0530" stroke="#F6C915" stroke-opacity="0.4" stroke-width="2"/>
      <text x="26" y="32" fill="#F6C915" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="2.5">CROWD CONSENSUS #1 VOTE</text>
      <text x="26" y="72" fill="#34D399" font-family="monospace" font-size="38" font-weight="900" letter-spacing="8">CROWD</text>
      <rect x="295" y="42" width="112" height="34" rx="17" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-opacity="0.5"/>
      <text x="351" y="64" text-anchor="middle" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="14" font-weight="900">142 VOTES</text>
    </g>

    <!-- Feature Badges -->
    <g transform="translate(0, 325)">
      <rect x="0" y="0" width="195" height="42" rx="12" fill="#2A0948" stroke="#A855F7" stroke-opacity="0.35"/>
      <text x="97" y="26" text-anchor="middle" fill="#F3E8FF" font-family="system-ui, sans-serif" font-size="13" font-weight="800">ENDLESS CHAIN MODE</text>

      <rect x="210" y="0" width="220" height="42" rx="12" fill="#2A0948" stroke="#F6C915" stroke-opacity="0.35"/>
      <text x="320" y="26" text-anchor="middle" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="13" font-weight="800">FIRST-TO-FIND BONUS</text>
    </g>
  </g>

  <!-- Right 5x5 Wordle Grid Card -->
  <g transform="translate(640, 88)">
    <rect x="0" y="0" width="470" height="500" rx="34" fill="#19032C" stroke="#F6C915" stroke-opacity="0.38" stroke-width="2.5"/>

    <!-- Row 1: SPARK -->
    <g transform="translate(45, 42)">
      <rect x="0" y="0" width="68" height="68" rx="14" fill="url(#slateTile)" stroke="#581C87" stroke-width="2"/>
      <text x="34" y="46" text-anchor="middle" fill="#D8B4FE" font-family="system-ui, sans-serif" font-size="34" font-weight="900">S</text>

      <rect x="78" y="0" width="68" height="68" rx="14" fill="url(#slateTile)" stroke="#581C87" stroke-width="2"/>
      <text x="112" y="46" text-anchor="middle" fill="#D8B4FE" font-family="system-ui, sans-serif" font-size="34" font-weight="900">P</text>

      <rect x="156" y="0" width="68" height="68" rx="14" fill="url(#slateTile)" stroke="#581C87" stroke-width="2"/>
      <text x="190" y="46" text-anchor="middle" fill="#D8B4FE" font-family="system-ui, sans-serif" font-size="34" font-weight="900">A</text>

      <rect x="234" y="0" width="68" height="68" rx="14" fill="url(#amberTile)" stroke="#FDE68A" stroke-width="2"/>
      <text x="268" y="46" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="34" font-weight="900">R</text>

      <rect x="312" y="0" width="68" height="68" rx="14" fill="url(#slateTile)" stroke="#581C87" stroke-width="2"/>
      <text x="346" y="46" text-anchor="middle" fill="#D8B4FE" font-family="system-ui, sans-serif" font-size="34" font-weight="900">K</text>
    </g>

    <!-- Row 2: CHORD -->
    <g transform="translate(45, 124)">
      <rect x="0" y="0" width="68" height="68" rx="14" fill="url(#emeraldTile)" stroke="#A7F3D0" stroke-width="2"/>
      <text x="34" y="46" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="34" font-weight="900">C</text>

      <rect x="78" y="0" width="68" height="68" rx="14" fill="url(#slateTile)" stroke="#581C87" stroke-width="2"/>
      <text x="112" y="46" text-anchor="middle" fill="#D8B4FE" font-family="system-ui, sans-serif" font-size="34" font-weight="900">H</text>

      <rect x="156" y="0" width="68" height="68" rx="14" fill="url(#emeraldTile)" stroke="#A7F3D0" stroke-width="2"/>
      <text x="190" y="46" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="34" font-weight="900">O</text>

      <rect x="234" y="0" width="68" height="68" rx="14" fill="url(#amberTile)" stroke="#FDE68A" stroke-width="2"/>
      <text x="268" y="46" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="34" font-weight="900">R</text>

      <rect x="312" y="0" width="68" height="68" rx="14" fill="url(#emeraldTile)" stroke="#A7F3D0" stroke-width="2"/>
      <text x="346" y="46" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="34" font-weight="900">D</text>
    </g>

    <!-- Row 3: CROWD (Winning Row!) -->
    <g transform="translate(45, 206)">
      <rect x="0" y="0" width="68" height="68" rx="14" fill="url(#emeraldTile)" stroke="#FFFFFF" stroke-width="2.5"/>
      <text x="34" y="46" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="34" font-weight="900">C</text>

      <rect x="78" y="0" width="68" height="68" rx="14" fill="url(#emeraldTile)" stroke="#FFFFFF" stroke-width="2.5"/>
      <text x="112" y="46" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="34" font-weight="900">R</text>

      <rect x="156" y="0" width="68" height="68" rx="14" fill="url(#emeraldTile)" stroke="#FFFFFF" stroke-width="2.5"/>
      <text x="190" y="46" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="34" font-weight="900">O</text>

      <rect x="234" y="0" width="68" height="68" rx="14" fill="url(#emeraldTile)" stroke="#FFFFFF" stroke-width="2.5"/>
      <text x="268" y="46" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="34" font-weight="900">W</text>

      <rect x="312" y="0" width="68" height="68" rx="14" fill="url(#emeraldTile)" stroke="#FFFFFF" stroke-width="2.5"/>
      <text x="346" y="46" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="34" font-weight="900">D</text>
    </g>

    <!-- Row 4: Empty -->
    <g transform="translate(45, 288)" opacity="0.45">
      <rect x="0" y="0" width="68" height="68" rx="14" fill="#140224" stroke="#6B21A8" stroke-width="2"/>
      <rect x="78" y="0" width="68" height="68" rx="14" fill="#140224" stroke="#6B21A8" stroke-width="2"/>
      <rect x="156" y="0" width="68" height="68" rx="14" fill="#140224" stroke="#6B21A8" stroke-width="2"/>
      <rect x="234" y="0" width="68" height="68" rx="14" fill="#140224" stroke="#6B21A8" stroke-width="2"/>
      <rect x="312" y="0" width="68" height="68" rx="14" fill="#140224" stroke="#6B21A8" stroke-width="2"/>
    </g>

    <!-- Bottom Streak Footer inside Card -->
    <rect x="45" y="388" width="380" height="72" rx="18" fill="#24073E" stroke="#F6C915" stroke-opacity="0.35"/>
    <text x="235" y="418" text-anchor="middle" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="13" font-weight="900" letter-spacing="2">FIRST TO FIND IT: @WORDMASTER_UK</text>
    <text x="235" y="444" text-anchor="middle" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="16" font-weight="900" letter-spacing="1.5">SYNC STREAK: 5/5 • LEVEL UP → 6 LETTERS</text>
  </g>
</svg>
