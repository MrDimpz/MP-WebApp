    <rect x="208" y="0" width="44" height="46" rx="10" fill="url(#purpleTile)" stroke="#D4A437" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="230" y="31" text-anchor="middle" fill="#A187C6" font-family="system-ui, sans-serif" font-size="22" font-weight="900">?</text>
    <!-- ? -->
