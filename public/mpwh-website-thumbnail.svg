<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none">
  <defs>
    <linearGradient id="whBg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A042E"/>
      <stop offset="55%" stop-color="#2D0A48"/>
      <stop offset="100%" stop-color="#130320"/>
    </linearGradient>
    <linearGradient id="goldTile" x1="0" y1="0" x2="0" y2="1">
