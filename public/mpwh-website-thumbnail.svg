  <rect x="438" y="264" width="166" height="60" rx="10" fill="#150424" stroke="#F6C915" stroke-opacity="0.4"/>
  <text x="448" y="281" fill="#F6C915" font-family="system-ui, sans-serif" font-size="10" font-weight="800">🏆 ROUND LEADERS</text>
