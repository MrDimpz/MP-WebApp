<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none">
  <defs>
    <linearGradient id="inkBg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#19042B"/>
      <stop offset="55%" stop-color="#2D0A48"/>
      <stop offset="100%" stop-color="#140321"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE46B"/>
      <stop offset="55%" stop-color="#F6C915"/>
      <stop offset="100%" stop-color="#D4A437"/>
    </linearGradient>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#F6C915" fill-opacity="0.14"/>
    </pattern>
  </defs>

  <rect width="640" height="360" rx="22" fill="url(#inkBg)"/>
  <rect width="640" height="360" rx="22" fill="url(#dotGrid)"/>

  <!-- Top Header Strip -->
  <rect x="24" y="20" width="592" height="44" rx="12" fill="#23063A" stroke="#D4A437" stroke-opacity="0.55" stroke-width="1.5"/>
  <circle cx="46" cy="42" r="11" fill="url(#goldGrad)"/>
  <path d="M41 45L49 37L51 39L43 47H41V45Z" fill="#1D0830"/>
  <text x="66" y="47" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="800" letter-spacing="0.4">InkStream</text>
  <rect x="164" y="31" width="108" height="22" rx="11" fill="#F6C915" fill-opacity="0.18" stroke="#F6C915" stroke-opacity="0.6"/>
  <circle cx="177" cy="42" r="4" fill="#34D399"/>
  <text x="187" y="46" fill="#F6C915" font-family="ui-monospace, monospace" font-size="11" font-weight="700">TIKTOK LIVE</text>

  <!-- Masked Word Hint -->
  <text x="392" y="47" text-anchor="middle" fill="#FFE46B" font-family="ui-monospace, monospace" font-size="17" font-weight="800" letter-spacing="4">P U Z Z L E</text>

  <!-- Timer Pill -->
  <rect x="536" y="30" width="66" height="24" rx="8" fill="#140321" stroke="#F6C915" stroke-width="1.5"/>
  <text x="569" y="46" text-anchor="middle" fill="#F6C915" font-family="ui-monospace, monospace" font-size="13" font-weight="800">42s</text>

  <!-- Main White Drawing Canvas -->
  <rect x="24" y="78" width="388" height="258" rx="16" fill="#FFFFFF" stroke="#F6C915" stroke-width="3"/>
  <!-- Stylized Puzzle Piece + Crown Sketch on Canvas -->
  <path d="M126 168 C126 150 154 146 162 162 C170 144 198 148 198 168 L244 168 C252 168 258 174 258 182 L258 206 C276 206 278 234 258 238 L258 266 C258 274 252 280 244 280 L198 280 C196 262 168 262 166 280 L126 280 C118 280 112 274 112 266 L112 182 C112 174 118 168 126 168 Z" fill="#F3E8FF" stroke="#4C1D95" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M150 144 L162 114 L182 132 L202 108 L220 132 L236 116 L246 144 Z" fill="#F6C915" stroke="#1D0830" stroke-width="4" stroke-linejoin="round"/>
  <!-- Brush stroke swoosh -->
  <path d="M74 294 C134 316 266 318 336 286" stroke="#A855F7" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
  <path d="M294 128 C316 116 346 126 352 146" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>

  <!-- Palette Swatches Bar at Bottom of Canvas -->
  <rect x="44" y="302" width="348" height="24" rx="12" fill="#1D0830" fill-opacity="0.92"/>
  <circle cx="68" cy="314" r="6" fill="#0F172A" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="88" cy="314" r="6" fill="#EF4444"/>
  <circle cx="108" cy="314" r="6" fill="#F6C915"/>
  <circle cx="128" cy="314" r="6" fill="#22C55E"/>
  <circle cx="148" cy="314" r="6" fill="#3B82F6"/>
  <circle cx="168" cy="314" r="6" fill="#9333EA"/>
  <circle cx="188" cy="314" r="6" fill="#EC4899"/>
  <text x="294" y="318" text-anchor="middle" fill="#F6C915" font-family="system-ui, sans-serif" font-size="10" font-weight="700">BRUSH · FILL · UNDO</text>

  <!-- Right Panel: Live TikTok Chat & Leaderboard -->
  <rect x="426" y="78" width="190" height="258" rx="16" fill="#220738" stroke="#D4A437" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="442" y="103" fill="#F6C915" font-family="system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="0.8">LIVE CHAT GUESSES</text>
  <line x1="438" y1="112" x2="604" y2="112" stroke="#D4A437" stroke-opacity="0.28"/>

  <!-- Chat Messages -->
  <rect x="438" y="122" width="166" height="34" rx="8" fill="#150424"/>
  <text x="448" y="136" fill="#C4B5FD" font-family="system-ui, sans-serif" font-size="10" font-weight="700">@sarah_live</text>
  <text x="448" y="149" fill="#E9D5FF" font-family="system-ui, sans-serif" font-size="11">crown jigsaw?</text>

  <rect x="438" y="164" width="166" height="38" rx="8" fill="#064E3B" stroke="#34D399" stroke-opacity="0.7"/>
  <text x="448" y="179" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="10" font-weight="800">✓ @puzzleking guessed it!</text>
  <text x="448" y="194" fill="#F6C915" font-family="ui-monospace, monospace" font-size="11" font-weight="800">+480 pts · 1st place</text>

  <rect x="438" y="210" width="166" height="34" rx="8" fill="#150424"/>
  <text x="448" y="224" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="10" font-weight="700">@mrdimpz</text>
  <text x="448" y="237" fill="#E9D5FF" font-family="system-ui, sans-serif" font-size="11">puzzle piece!</text>

  <!-- Mini Leaderboard Footer -->
  <rect x="438" y="254" width="166" height="70" rx="10" fill="#150424" stroke="#F6C915" stroke-opacity="0.4"/>
  <text x="448" y="271" fill="#F6C915" font-family="system-ui, sans-serif" font-size="10" font-weight="800">🏆 TIKTOK TOP 3</text>
  <text x="448" y="288" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="700">1. @puzzleking</text>
  <text x="594" y="288" text-anchor="end" fill="#F6C915" font-family="ui-monospace, monospace" font-size="10" font-weight="800">1,420</text>
  <text x="448" y="303" fill="#DDD6FE" font-family="system-ui, sans-serif" font-size="10" font-weight="600">2. @sarah_live</text>
  <text x="594" y="303" text-anchor="end" fill="#DDD6FE" font-family="ui-monospace, monospace" font-size="10" font-weight="700">980</text>
  <text x="448" y="317" fill="#C4B5FD" font-family="system-ui, sans-serif" font-size="10" font-weight="600">3. @sketchfan</text>
  <text x="594" y="317" text-anchor="end" fill="#C4B5FD" font-family="ui-monospace, monospace" font-size="10" font-weight="700">740</text>
</svg>
