<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none">
  <defs>
    <linearGradient id="gdBg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#19042C"/>
      <stop offset="52%" stop-color="#2E0A4C"/>
      <stop offset="100%" stop-color="#12031F"/>
    </linearGradient>
    <linearGradient id="gdGoldBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F6C915"/>
      <stop offset="100%" stop-color="#E5B20B"/>
    </linearGradient>
    <linearGradient id="gdTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#351158"/>
      <stop offset="100%" stop-color="#210839"/>
    </linearGradient>
    <pattern id="gdDots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#F6C915" fill-opacity="0.14"/>
    </pattern>
  </defs>

  <rect width="640" height="360" rx="22" fill="url(#gdBg)"/>
  <rect width="640" height="360" rx="22" fill="url(#gdDots)"/>

  <!-- Header Bar -->
  <rect x="24" y="20" width="592" height="44" rx="12" fill="#23063A" stroke="#D4A437" stroke-opacity="0.55" stroke-width="1.5"/>
  <!-- 4 Layer Bars Emblem -->
  <rect x="38" y="30" width="22" height="4.2" rx="1.5" fill="#F6C915"/>
  <rect x="38" y="36.2" width="22" height="4.2" rx="1.5" fill="#2E7D52"/>
  <rect x="38" y="42.4" width="22" height="4.2" rx="1.5" fill="#2C6FB0"/>
  <rect x="38" y="48.6" width="22" height="4.2" rx="1.5" fill="#8B5CF6"/>

  <text x="70" y="47" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="800" letter-spacing="0.2">Going Deep</text>
  <rect x="168" y="31" width="132" height="22" rx="11" fill="#F6C915" fill-opacity="0.18" stroke="#F6C915" stroke-opacity="0.6"/>
  <text x="234" y="46" text-anchor="middle" fill="#F6C915" font-family="ui-monospace, monospace" font-size="10.5" font-weight="800">4-IN-1 DAILY PUZZLE</text>
  <text x="598" y="46" text-anchor="end" fill="#D9C7EE" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">4 · 8 · 12 LAYER KEYS</text>

  <!-- Left Main Board -->
  <rect x="24" y="78" width="388" height="258" rx="16" fill="#1B052E" stroke="#F6C915" stroke-opacity="0.48" stroke-width="2"/>

  <!-- Solved Band 1: Gold -->
  <rect x="38" y="92" width="360" height="46" rx="10" fill="url(#gdGoldBand)" stroke="#FCE16A" stroke-width="1"/>
  <text x="218" y="111" text-anchor="middle" fill="#1D0830" font-family="system-ui, sans-serif" font-size="11" font-weight="900" letter-spacing="0.8">ROYAL TREASURES</text>
  <text x="218" y="128" text-anchor="middle" fill="#2B0938" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">CROWN  ·  SCEPTRE  ·  ORB  ·  THRONE</text>

  <!-- Solved Band 2: Emerald -->
  <rect x="38" y="145" width="360" height="46" rx="10" fill="#2E7D52" stroke="#4ADE80" stroke-opacity="0.55" stroke-width="1"/>
  <text x="218" y="164" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="900" letter-spacing="0.8">STRINGS &amp; KEYS</text>
  <text x="218" y="181" text-anchor="middle" fill="#DCFCE7" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">HARP  ·  CELLO  ·  VIOLA  ·  LUTE</text>

  <!-- Remaining 8 Tiles (2x4 Grid with Locked Key Tiles) -->
  <!-- Row 1 -->
  <rect x="38" y="200" width="84" height="58" rx="10" fill="url(#gdTile)" stroke="#D4A437" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="80" y="233" text-anchor="middle" fill="#FAF7FF" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800">COMPASS</text>

  <rect x="130" y="200" width="84" height="58" rx="10" fill="#F6C915" stroke="#FFE56B" stroke-width="1.5"/>
  <text x="172" y="233" text-anchor="middle" fill="#1D0830" font-family="system-ui, sans-serif" font-size="11.5" font-weight="900">LANTERN</text>

  <rect x="222" y="200" width="84" height="58" rx="10" fill="#140321" stroke="#F6C915" stroke-dasharray="4 3" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="264" y="224" text-anchor="middle" fill="#F6C915" font-family="ui-monospace, monospace" font-size="9.5" font-weight="800">🔒 LOCKED</text>
  <text x="264" y="241" text-anchor="middle" fill="#E9D5FF" font-family="system-ui, sans-serif" font-size="10" font-weight="700">LetterLock</text>

  <rect x="314" y="200" width="84" height="58" rx="10" fill="url(#gdTile)" stroke="#D4A437" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="356" y="233" text-anchor="middle" fill="#FAF7FF" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800">ANCHOR</text>

  <!-- Row 2 -->
  <rect x="38" y="266" width="84" height="58" rx="10" fill="#140321" stroke="#A78BFA" stroke-dasharray="4 3" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="80" y="290" text-anchor="middle" fill="#C4B5FD" font-family="ui-monospace, monospace" font-size="9.5" font-weight="800">🔒 LOCKED</text>
  <text x="80" y="307" text-anchor="middle" fill="#E9D5FF" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Crossword</text>

  <rect x="130" y="266" width="84" height="58" rx="10" fill="url(#gdTile)" stroke="#D4A437" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="172" y="299" text-anchor="middle" fill="#FAF7FF" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800">BEACON</text>

  <rect x="222" y="266" width="84" height="58" rx="10" fill="url(#gdTile)" stroke="#D4A437" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="264" y="299" text-anchor="middle" fill="#FAF7FF" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800">CIPHER</text>

  <rect x="314" y="266" width="84" height="58" rx="10" fill="#140321" stroke="#38BDF8" stroke-dasharray="4 3" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="356" y="290" text-anchor="middle" fill="#7DD3FC" font-family="ui-monospace, monospace" font-size="9.5" font-weight="800">🔒 LOCKED</text>
  <text x="356" y="307" text-anchor="middle" fill="#E9D5FF" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Word Search</text>

  <!-- Right Panel: 4 Mini-Game Keys -->
  <rect x="426" y="78" width="190" height="258" rx="16" fill="#220738" stroke="#D4A437" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="442" y="103" fill="#F6C915" font-family="system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="0.8">LAYER KEY VAULT</text>
  <line x1="438" y1="112" x2="604" y2="112" stroke="#D4A437" stroke-opacity="0.28"/>

  <!-- Mini-game 1 -->
  <rect x="438" y="122" width="166" height="44" rx="10" fill="#150424" stroke="#F6C915" stroke-opacity="0.5"/>
  <rect x="448" y="132" width="24" height="24" rx="6" fill="#F6C915"/>
  <text x="460" y="149" text-anchor="middle" fill="#1D0830" font-family="ui-monospace, monospace" font-size="12" font-weight="900">L</text>
  <text x="480" y="142" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="800">LetterLock</text>
  <text x="480" y="156" fill="#F6C915" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700">5–6 letter deduction</text>

  <!-- Mini-game 2 -->
  <rect x="438" y="174" width="166" height="44" rx="10" fill="#103624" stroke="#34D399" stroke-opacity="0.65"/>
  <rect x="448" y="184" width="24" height="24" rx="6" fill="#2E7D52"/>
  <text x="460" y="200" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="900">✓</text>
  <text x="480" y="194" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Anagram</text>
  <text x="480" y="208" fill="#6EE7B7" font-family="ui-monospace, monospace" font-size="9.5" font-weight="800">UNLOCKED: CROWN</text>

  <!-- Mini-game 3 -->
  <rect x="438" y="226" width="166" height="44" rx="10" fill="#150424" stroke="#8B5CF6" stroke-opacity="0.5"/>
  <rect x="448" y="236" width="24" height="24" rx="6" fill="#5B21B6"/>
  <text x="460" y="253" text-anchor="middle" fill="#FAF7FF" font-family="ui-monospace, monospace" font-size="12" font-weight="900">#</text>
  <text x="480" y="246" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Mini Crossword</text>
  <text x="480" y="260" fill="#C4B5FD" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700">Vertical key column</text>

  <!-- Mini-game 4 -->
  <rect x="438" y="278" width="166" height="44" rx="10" fill="#150424" stroke="#38BDF8" stroke-opacity="0.5"/>
  <rect x="448" y="288" width="24" height="24" rx="6" fill="#2C6FB0"/>
  <text x="460" y="305" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, monospace" font-size="12" font-weight="900">⌕</text>
  <text x="480" y="298" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Word Search</text>
  <text x="480" y="312" fill="#93C5FD" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700">7×7 · 8×8 · 9×9 grid</text>
</svg>
