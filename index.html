    <script>
      // Prevent @vite/client from throwing "WebSocket closed without opened" when HMR is disabled in AI Studio
      (function() {
        var OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          var PatchedWebSocket = function(url, protocols) {
            var protoStr = Array.isArray(protocols) ? protocols.join(',') : String(protocols || '');
            if (protoStr.indexOf('vite-hmr') !== -1 || protoStr.indexOf('vite-ping') !== -1) {
              return {
                url: String(url || ''),
                readyState: 1,
                OPEN: 1,
                CONNECTING: 0,
                CLOSING: 2,
                CLOSED: 3,
                protocol: protoStr,
                extensions: '',
                bufferedAmount: 0,
                binaryType: 'blob',
                addEventListener: function(type, listener) {
                  if (type === 'open' && typeof listener === 'function') {
                    setTimeout(function() {
                      try { listener({ type: 'open' }); } catch (e) {}
                    }, 0);
                  }
                },
                removeEventListener: function() {},
                dispatchEvent: function() { return true; },
                send: function() {},
                close: function() {}
              };
            }
            return protocols !== undefined
              ? new OriginalWebSocket(url, protocols)
              : new OriginalWebSocket(url);
          };
          PatchedWebSocket.prototype = OriginalWebSocket.prototype;
          PatchedWebSocket.CONNECTING = OriginalWebSocket.CONNECTING;
          PatchedWebSocket.OPEN = OriginalWebSocket.OPEN;
          PatchedWebSocket.CLOSING = OriginalWebSocket.CLOSING;
          PatchedWebSocket.CLOSED = OriginalWebSocket.CLOSED;
          window.WebSocket = PatchedWebSocket;
        }
      })();
    </script>
